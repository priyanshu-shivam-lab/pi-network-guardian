name: 🚀 Deploy to Raspberry Pi

on:
  push:
    branches: [main]
  workflow_dispatch: # also allow manual trigger from GitHub UI

jobs:
  deploy:
    name: Deploy to Pi
    runs-on: self-hosted   # executes on the runner installed on your Pi

    steps:
      - name: 📥 Pull latest code
        run: git -C "${{ vars.APP_DIR }}" pull origin main

      - name: 📦 Install / update dependencies
        working-directory: ${{ vars.APP_DIR }}
        run: npm ci --omit=dev

      - name: ♻️ Restart app with PM2
        working-directory: ${{ vars.APP_DIR }}
        run: |
          # Start if not running yet, otherwise reload gracefully
          pm2 describe pi-guardian > /dev/null 2>&1 \
            && pm2 reload pi-guardian \
            || pm2 start server.js --name pi-guardian
          pm2 save

      - name: ✅ Health check
        working-directory: ${{ vars.APP_DIR }}
        run: |
          sleep 3
          pm2 show pi-guardian | grep -E "status|uptime|restarts"
